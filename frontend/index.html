<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Payment Engine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding: 60px;
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 15px #ddd;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        #result {
            margin-top: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment & Notification Engine</h1>
        <p>Enterprise Fintech DevOps Capstone</p>

        <button onclick="callAPI('payment')">
            Simulate Payment
        </button>

        <button onclick="callAPI('notification')">
            Send Notification
        </button>

        <div id="result"></div>
    </div>

    <script>
        async function callAPI(endpoint) {
            const result = document.getElementById("result");
            result.innerText = "Processing...";

            try {
                const response = await fetch("/api/" + endpoint);

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                const data = await response.json();
                result.innerText = JSON.stringify(data, null, 2);
            } catch (error) {
                result.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
